  <!-- Google Fonts: Bricolage Grotesque · DM Sans · JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css">

  <!--
    CUSTOMIZE PER COURSE — change only the four accent variables below.
    Order: ACCENT_COLOR / ACCENT_HOVER / ACCENT_LIGHT / ACCENT_MUTED

    These are tuned for the dark page background. Note two things that
    differ from a light theme: HOVER is LIGHTER than the base colour, and
    LIGHT is a dark tint used as a background (callouts, glows) — not a
    pale wash. Do not substitute light-theme accent values here.

      vermillion  #E85E3D / #F2795A / #3D231B / #E8836C  (default)
      coral       #E87A64 / #F09582 / #3D2521 / #E89585
      teal        #4BA3C7 / #6FBFDE / #16303B / #5A9DB8
      amber       #E0B851 / #EDCC77 / #3B3018 / #E0C070
      forest      #4FB37A / #6FCB96 / #1C3527 / #5AAD7A
  -->
  <style>
    :root {
      --color-accent:       ACCENT_COLOR;
      --color-accent-hover: ACCENT_HOVER;
      --color-accent-light: ACCENT_LIGHT;
      --color-accent-muted: ACCENT_MUTED;
    }
  </style>

  <script src="main.js" defer></script>
</head>
